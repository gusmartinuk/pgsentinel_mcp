services:
  pgsentinel-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgsentinel-mcp
    restart: unless-stopped
    environment:
      APP_PORT: 8088
      PGSENTINEL_VAULT: /secure/pgsentinel/vault.enc
      PGSENTINEL_AUDIT_LOG: /var/log/pgsentinel/audit.log
      PGSENTINEL_SERVER_LOG: /var/log/pgsentinel/server.log
      PGSENTINEL_MCP_HTTP_ENABLED: "true"
      PGSENTINEL_ENV: production
      PGSENTINEL_COOKIE_SECURE: "${PGSENTINEL_COOKIE_SECURE:-true}"
      PGSENTINEL_ALLOW_LEGACY_CONFIG: "${PGSENTINEL_ALLOW_LEGACY_CONFIG:-false}"
      PGSENTINEL_REQUIRE_EXISTING_VAULT: "${PGSENTINEL_REQUIRE_EXISTING_VAULT:-false}"
      PGSENTINEL_VAULT_DIR: "${PGSENTINEL_VAULT_DIR:-/secure/pgsentinel/vaults}"
      PGSENTINEL_ACTIVE_VAULT_FILE: "${PGSENTINEL_ACTIVE_VAULT_FILE:-/secure/pgsentinel/vaults/.active_vault}"
      PGSENTINEL_SSH_KNOWN_HOSTS: "${PGSENTINEL_SSH_KNOWN_HOSTS:-/secure/pgsentinel/known_hosts}"
      PGSENTINEL_MASTER_PASSWORD: "${PGSENTINEL_MASTER_PASSWORD:-}"
      PGSENTINEL_MASTER_PASSWORD_FILE: "${PGSENTINEL_MASTER_PASSWORD_FILE:-/secure/pgsentinel/master_password.txt}"
    ports:
      - "127.0.0.1:${PGSENTINEL_PORT:-8088}:8088"
    volumes:
      - ${PGSENTINEL_DATA_DIR:-/opt/pgsentinel/data}:/secure/pgsentinel:rw
      - ${PGSENTINEL_LOG_DIR:-/opt/pgsentinel/logs}:/var/log/pgsentinel:rw
      - ${PGSENTINEL_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8088/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
