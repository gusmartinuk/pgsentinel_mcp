[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgsentinel-mcp"
version = "0.1.0"
description = "Read-only MCP diagnostic gateway for remote Docker and PostgreSQL environments"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "mcp>=1.9,<2.0",
  "paramiko>=3.5,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn[standard]>=0.34,<1.0",
  "argon2-cffi>=21.3",
  "bcrypt>=4.0",
  "cryptography>=41.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "playwright>=1.54,<2.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
