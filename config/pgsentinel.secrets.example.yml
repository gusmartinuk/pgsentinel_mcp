project:
  name: "PgSentinel MCP"
  environment: "staging"

server:
  mode: "ssh"
  host: "your-vps-ip-or-hostname"
  port: 22
  username: "mcp-monitor"
  ssh_private_key_path: "/secrets/id_ed25519"
  ssh_private_key_passphrase: null

security:
  default_readonly: true
  allow_write_tools: false
  allow_raw_sql: false
  allow_raw_shell: false
  max_log_lines: 300
  max_query_rows: 100
  command_timeout_seconds: 20

docker:
  allowed_containers:
    - "postgres"
    - "app"
    - "nginx"
    - "redis"

postgres:
  container_name: "postgres"
  database: "appdb"
  username: "readonly_user"
  password: "readonly_password"
  host_inside_container: "localhost"
  port_inside_container: 5432
  allowed_schemas:
    - "public"
  allowed_tables:
    - "users"
    - "orders"
    - "jobs"
    - "failed_jobs"
    - "migrations"
  sensitive_columns:
    - "password"
    - "password_hash"
    - "token"
    - "secret"
    - "api_key"
    - "private_key"

logs:
  allowed_logs:
    app:
      type: "docker"
      container: "app"
      max_lines: 300
    nginx:
      type: "docker"
      container: "nginx"
      max_lines: 300
    postgres:
      type: "docker"
      container: "postgres"
      max_lines: 300

masking:
  patterns:
    - "password="
    - "PASSWORD="
    - "token="
    - "TOKEN="
    - "Authorization:"
    - "Bearer "
    - "DB_PASSWORD="
    - "APP_KEY="
    - "SECRET="
    - "PRIVATE_KEY"
    - "AWS_SECRET_ACCESS_KEY="
