project:
  name: "PgSentinel MCP"
  environment: "local"

server:
  mode: "local"

security:
  default_readonly: true
  allow_write_tools: false
  allow_raw_sql: false
  allow_raw_shell: false
  max_log_lines: 300
  max_query_rows: 100
  command_timeout_seconds: 20

docker:
  allowed_containers:
    - "myapp-postgres"
    - "myapp-web"

postgres:
  container_name: "myapp-postgres"
  database: "myapp"
  username: "myapp_user"
  password: "replace-with-local-password"
  host_inside_container: "localhost"
  port_inside_container: 5432
  allowed_schemas:
    - "public"
  allowed_tables:
    - "migrations"
    - "users"
    - "jobs"

logs:
  allowed_logs:
    app:
      type: "docker"
      container: "myapp-web"
      max_lines: 300
    postgres:
      type: "docker"
      container: "myapp-postgres"
      max_lines: 300

masking:
  patterns:
    - "password="
    - "PASSWORD="
    - "token="
    - "TOKEN="
    - "Authorization:"
    - "Bearer "
    - "DATABASE_URL="
    - "DB_PASSWORD="
    - "SECRET_KEY="
    - "APP_KEY="
    - "SECRET="
    - "PRIVATE_KEY"
